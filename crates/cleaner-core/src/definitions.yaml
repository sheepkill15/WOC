# Built-in application definitions.
# Paths may name a data directory and at most one child folder below it.
# Supported roots: %LOCALAPPDATA%, %APPDATA%, %LOCALAPPDATALOW%, %PROGRAMDATA%.
# Types use the content categories from the specification (CACHE, LOG, CONFIGURATION, ...).
- id: discord
  vendor: discord
  product: Discord
  identifiers: { executables: [Discord.exe] }
  paths:
    - { path: "%APPDATA%\\discord", type: APPLICATION_STATE }
    - { path: "%APPDATA%\\discord\\Cache", type: CACHE }
    - { path: "%APPDATA%\\discord\\Code Cache", type: CACHE }
    - { path: "%APPDATA%\\discord\\GPUCache", type: SHADER_CACHE }
    - { path: "%APPDATA%\\discord\\logs", type: LOG }
    - { path: "%APPDATA%\\discord\\Crashpad", type: CRASH_DUMP }
    - { path: "%APPDATA%\\discord\\Local Storage", type: SESSION_DATA }
    - { path: "%LOCALAPPDATA%\\Discord", type: APPLICATION_BINARIES }
    - { path: "%LOCALAPPDATA%\\Discord\\packages", type: UPDATE_CACHE }
