[package]
name = "windows-orphan-cleaner"
version = "0.1.0"
edition = "2024"
default-run = "windows-orphan-cleaner"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cleaner-core = { path = "../crates/cleaner-core" }
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3"
futures-core = "0.3"
